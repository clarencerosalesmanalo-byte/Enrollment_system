<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniEnroll \u2014 Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon:    #7B1D1D;
    --maroon-dk: #5A1212;
    --maroon-lt: #9E2A2A;
    --gold:      #F5C518;
    --gold-dk:   #D4A800;
    --gold-lt:   #FDD835;
    --white:     #FFFFFF;
    --cream:     #FFFDF5;
    --offwhite:  #F9F5EC;
    --border:    #E8DFC8;
    --text:      #1C1008;
    --muted:     #8A7560;
    --danger:    #C0392B;
    --success:   #1A6B32;
    --shadow-sm: 0 2px 8px rgba(123,29,29,.10);
    --shadow-md: 0 6px 28px rgba(123,29,29,.14);
    --shadow-lg: 0 16px 56px rgba(123,29,29,.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--offwhite);
    color: var(--text);
    min-height: 100vh;
  }

  /* \u2500\u2500\u2500 HEADER \u2500\u2500\u2500 */
  header {
    background: linear-gradient(135deg, var(--maroon-dk) 0%, var(--maroon) 60%, var(--maroon-lt) 100%);
    color: var(--white);
    padding: 0 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 24px rgba(90,18,18,.35);
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-dk), var(--gold), var(--gold-lt), var(--gold));
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--white);
    display: flex; align-items: center; gap: .5rem;
    text-decoration: none;
    letter-spacing: .01em;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    color: var(--maroon-dk);
    font-weight: 800;
    flex-shrink: 0;
  }
  .logo span { color: var(--gold); }
  .header-badge {
    background: rgba(245,197,24,.18);
    border: 1.5px solid rgba(245,197,24,.35);
    color: var(--gold-lt);
    font-size: .8rem;
    font-weight: 600;
    padding: .3rem .9rem;
    border-radius: 20px;
    display: flex; align-items: center; gap: .4rem;
    letter-spacing: .02em;
  }
  .student-link {
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.18);
    color: rgba(255,255,255,.75);
    padding: .42rem 1.05rem;
    border-radius: 7px;
    font-family: 'Outfit', sans-serif;
    font-size: .83rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: .3rem;
  }
  .student-link:hover { background: rgba(245,197,24,.15); border-color: rgba(245,197,24,.45); color: var(--gold-lt); }

  /* \u2500\u2500\u2500 LAYOUT \u2500\u2500\u2500 */
  .auth-wrap {
    min-height: calc(100vh - 68px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(123,29,29,.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(245,197,24,.09) 0%, transparent 50%),
      var(--offwhite);
  }
